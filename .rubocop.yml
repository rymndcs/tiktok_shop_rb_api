# Shared by shopee_rb_api, lazada_rb_api and tiktok_shop_rb_api. Copy verbatim; never edit in one gem only.
plugins:
  - rubocop-minitest
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/Documentation:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Max: 20
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Max: 150
  Exclude:
    - "test/**/*"

Metrics/ModuleLength:
  Max: 150
  Exclude:
    - "test/**/*"

Metrics/BlockLength:
  Enabled: false

Metrics/ParameterLists:
  CountKeywordArgs: false

Gemspec/DevelopmentDependencies:
  EnforcedStyle: Gemfile
